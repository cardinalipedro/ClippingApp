<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clipador — cortes verticais no navegador</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="topo">
      <h1>Clipador<span>.</span></h1>
      <p>Corte, enquadre em 9:16 e baixe. Tudo roda no seu navegador — nada é enviado pra servidor.</p>
    </header>

    <main>
      <!-- ETAPA 1: escolher o vídeo -->
      <section id="etapaUpload" class="card">
        <label for="arquivo" class="dropzone" id="dropzone">
          <strong>Arraste um vídeo aqui</strong>
          <span>ou clique para escolher (mp4, mov, mkv, webm)</span>
          <input type="file" id="arquivo" accept="video/*,.mkv,.mov" hidden />
        </label>
      </section>

      <!-- ETAPA 2: editar -->
      <section id="etapaEditor" class="card" hidden>
        <div class="palco">
          <div class="video-wrap" id="videoWrap">
            <video id="video" controls playsinline></video>
            <!-- Retângulo que mostra o que vai aparecer no clipe vertical -->
            <div class="moldura" id="moldura" hidden></div>
          </div>
        </div>

        <div class="controles">
          <div class="linha">
            <button id="btnInicio" type="button">Marcar início <kbd>I</kbd></button>
            <button id="btnFim" type="button">Marcar fim <kbd>O</kbd></button>
            <button id="btnOuvir" type="button">▶ Ver trecho <kbd>P</kbd></button>
          </div>

          <div class="linha tempos">
            <label>Início (s) <input type="number" id="inicio" step="0.1" min="0" value="0" /></label>
            <label>Fim (s) <input type="number" id="fim" step="0.1" min="0" value="0" /></label>
            <span id="duracao" class="pill">Duração: 0.0s</span>
          </div>

          <fieldset class="linha opcoes">
            <legend>Formato</legend>
            <label><input type="radio" name="formato" value="vertical" checked /> Vertical 9:16 (recorte)</label>
            <label><input type="radio" name="formato" value="desfocado" /> Vertical com fundo desfocado</label>
            <label><input type="radio" name="formato" value="original" /> Original (rápido, sem recodificar)</label>
          </fieldset>

          <div class="linha" id="linhaPosicao">
            <label class="cresce">Posição do enquadramento
              <input type="range" id="posicao" min="0" max="100" value="50" />
            </label>
          </div>

          <div class="linha" id="linhaResolucao">
            <label>Resolução
              <select id="resolucao">
                <option value="1080">1080×1920 (melhor qualidade)</option>
                <option value="720">720×1280 (exporta mais rápido)</option>
              </select>
            </label>
          </div>

          <div class="linha">
            <button id="btnExportar" class="primario" type="button">Exportar clipe</button>
            <button id="btnTrocar" class="secundario" type="button">Trocar vídeo</button>
          </div>

          <div class="progresso" id="progresso" hidden>
            <div class="barra"><div id="barra"></div></div>
            <span id="status">Preparando…</span>
          </div>
        </div>
      </section>

      <!-- ETAPA 3: resultados -->
      <section id="etapaClipes" class="card" hidden>
        <h2>Clipes exportados</h2>
        <ul id="listaClipes" class="clipes"></ul>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
