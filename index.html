<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clipador — cortes verticais no navegador</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
    <!-- Aplica o tema salvo ANTES de a página aparecer, pra não piscar na cor errada -->
    <script>
      try {
        if (localStorage.getItem('clipador.tema') === 'claro') document.documentElement.dataset.tema = 'claro';
      } catch (e) {}
    </script>
  </head>
  <body>
    <!--
      Os textos com data-i18n são preenchidos pelo src/i18n.js no idioma escolhido.
      O texto escrito aqui (em português) é só o que aparece antes do JavaScript carregar.
    -->
    <header class="topo">
      <div class="topo-acoes">
        <!-- Troca o idioma da INTERFACE (não o idioma da legenda) -->
        <div class="segmentado troca-idioma" role="radiogroup" data-i18n-aria="t.interface">
          <label><input type="radio" name="interface" value="pt" /><span>PT</span></label>
          <label><input type="radio" name="interface" value="en" /><span>EN</span></label>
          <label><input type="radio" name="interface" value="es" /><span>ES</span></label>
        </div>
        <!-- Troca entre tema escuro e claro -->
        <button id="btnTema" class="troca-tema" type="button">
          <svg class="lua" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6.2 1.6a6.5 6.5 0 1 0 8.2 8.2A5.5 5.5 0 0 1 6.2 1.6z" /></svg>
          <svg class="sol" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3" /><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" /></svg>
        </button>
      </div>
      <h1>Los Angeles Clippers<span>.</span></h1>
      <p data-i18n="header.sub">Corte, enquadre em 9:16 e baixe. Tudo roda no seu navegador — nada é enviado pra servidor.</p>
    </header>

    <main>
      <!-- ETAPA 1: escolher o vídeo -->
      <section id="etapaUpload" class="card">
        <div class="modos">
          <label class="dropzone" data-modo="curto">
            <strong data-i18n="modo.curto.titulo">Clipe curto</strong>
            <span data-i18n="modo.curto.desc">Já tem o trecho pronto? A legenda é gerada sozinha.</span>
            <span class="formatos" data-i18n="modo.curto.dica">Arraste ou clique · até 3 min</span>
            <input type="file" accept="video/*,.mkv,.mov" hidden />
          </label>
          <label class="dropzone" data-modo="longo">
            <strong data-i18n="modo.longo.titulo">Vídeo longo</strong>
            <span data-i18n="modo.longo.desc">O app acha os melhores momentos, corta e legenda cada um.</span>
            <span class="formatos" data-i18n="modo.longo.dica">Arraste ou clique · 10 min ou mais</span>
            <input type="file" accept="video/*,.mkv,.mov" hidden />
          </label>
        </div>
        <div class="grupo sem-linha">
          <label class="rotulo" for="idiomaInicial" data-i18n="idioma.falado">Idioma falado</label>
          <div class="conteudo">
            <select id="idiomaInicial">
              <option value="portuguese">Português</option>
              <option value="english">English</option>
              <option value="spanish">Español</option>
            </select>
          </div>
        </div>
      </section>

      <!-- ETAPA 2: editar -->
      <section id="etapaEditor" class="card" hidden>
        <div class="palco">
          <div class="video-wrap" id="videoWrap">
            <video id="video" controls playsinline></video>
            <!-- Retângulo que mostra o que vai aparecer no clipe vertical -->
            <div class="moldura" id="moldura" hidden></div>
            <!-- Prévia da legenda por cima do player -->
            <div class="legenda-previa" id="legendaPrevia" hidden></div>
          </div>
        </div>

        <!-- Só aparece no modo "vídeo longo". Nada roda até clicar em "Encontrar momentos". -->
        <div class="momentos" id="painelMomentos" hidden>
          <div class="momentos-topo">
            <span class="rotulo" data-i18n="mom.rotulo">Momentos</span>
            <select id="metodoMomentos" data-i18n-title="mom.metodo.titulo">
              <option value="ia" data-i18n="mom.ia">Por IA (Gemini)</option>
              <option value="som" data-i18n="mom.som">Pelo som</option>
            </select>
            <select id="duracaoClipe" data-i18n-title="mom.dur.titulo">
              <option value="20" data-i18n="mom.dur" data-n="20">Clipes de 20 s</option>
              <option value="30" data-i18n="mom.dur" data-n="30" selected>Clipes de 30 s</option>
              <option value="45" data-i18n="mom.dur" data-n="45">Clipes de 45 s</option>
              <option value="60" data-i18n="mom.dur" data-n="60">Clipes de 60 s</option>
            </select>
            <select id="quantidadeClipes" data-i18n-title="mom.qtd.titulo">
              <option value="3" data-i18n="mom.qtd" data-n="3">Até 3</option>
              <option value="5" data-i18n="mom.qtd" data-n="5" selected>Até 5</option>
              <option value="8" data-i18n="mom.qtd" data-n="8">Até 8</option>
              <option value="10" data-i18n="mom.qtd" data-n="10">Até 10</option>
            </select>
            <select id="idiomaMomentos" data-i18n-title="idioma.falado.titulo">
              <option value="portuguese">Português</option>
              <option value="english">English</option>
              <option value="spanish">Español</option>
            </select>
            <label class="check"><input type="checkbox" id="legendarLote" checked /> <span data-i18n="mom.legendar">Legendar</span></label>
            <button id="btnAnalisar" class="primario empurra" type="button">Encontrar momentos</button>
            <button id="btnLote" class="primario" type="button" hidden>Gerar clipes</button>
          </div>
          <div class="linha-chave" id="linhaChave" hidden>
            <label for="chaveGemini" data-i18n="mom.chave">Chave do Gemini</label>
            <input type="password" id="chaveGemini" data-i18n-placeholder="mom.chave.placeholder" autocomplete="off" spellcheck="false" />
            <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" data-i18n="mom.chave.link">Criar chave grátis</a>
          </div>
          <ol id="listaMomentos"></ol>
          <p class="dica" id="dicaMomentos" data-i18n="mom.dica">Escolha as opções acima e clique em Encontrar momentos.</p>
        </div>

        <div class="controles">
          <div class="grupo">
            <span class="rotulo" data-i18n="trecho">Trecho</span>
            <div class="conteudo">
              <div class="campo">
                <label for="inicio" data-i18n="inicio">Início</label>
                <input type="number" id="inicio" step="0.1" min="0" value="0" />
                <span class="unidade">s</span>
                <button id="btnInicio" type="button" data-i18n-title="marcar.inicio.titulo"><span data-i18n="marcar">Marcar</span> <kbd>I</kbd></button>
              </div>
              <div class="campo">
                <label for="fim" data-i18n="fim">Fim</label>
                <input type="number" id="fim" step="0.1" min="0" value="0" />
                <span class="unidade">s</span>
                <button id="btnFim" type="button" data-i18n-title="marcar.fim.titulo"><span data-i18n="marcar">Marcar</span> <kbd>O</kbd></button>
              </div>
              <span id="duracao" class="pill"></span>
              <button id="btnOuvir" class="secundario empurra" type="button">
                <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" /></svg>
                <span data-i18n="ver">Ver trecho</span> <kbd>P</kbd>
              </button>
            </div>
          </div>

          <div class="grupo">
            <span class="rotulo" id="rotuloFormato" data-i18n="formato">Formato</span>
            <div class="conteudo">
              <div class="segmentado" role="radiogroup" aria-labelledby="rotuloFormato">
                <label><input type="radio" name="formato" value="vertical" checked /><span data-i18n="fmt.vertical">Vertical 9:16</span></label>
                <label><input type="radio" name="formato" value="desfocado" /><span data-i18n="fmt.desfocado">Fundo desfocado</span></label>
                <label><input type="radio" name="formato" value="original" /><span data-i18n="fmt.original">Original</span></label>
              </div>
            </div>
          </div>

          <div class="grupo" id="linhaPosicao">
            <label class="rotulo" for="posicao" data-i18n="enquadramento">Enquadramento</label>
            <div class="conteudo">
              <span class="extremo" data-i18n="esq">Esq.</span>
              <input type="range" id="posicao" min="0" max="100" value="50" />
              <span class="extremo" data-i18n="dir">Dir.</span>
            </div>
          </div>

          <div class="grupo" id="linhaResolucao">
            <label class="rotulo" for="resolucao" data-i18n="resolucao">Resolução</label>
            <div class="conteudo">
              <select id="resolucao">
                <option value="1080">1080 × 1920</option>
                <option value="720" data-i18n="res.720">720 × 1280 (exporta mais rápido)</option>
              </select>
            </div>
          </div>

          <div class="grupo">
            <label class="rotulo" for="idioma" data-i18n="legenda">Legenda</label>
            <div class="conteudo">
              <select id="idioma" data-i18n-title="idioma.falado.titulo">
                <option value="portuguese">Português</option>
                <option value="english">English</option>
                <option value="spanish">Español</option>
              </select>
              <button id="btnLegenda" type="button">Gerar legenda</button>
              <button id="btnRemoverLegenda" class="secundario" type="button" hidden data-i18n="legenda.remover">Remover</button>
              <span class="dica" id="dicaLegenda"></span>
            </div>
          </div>

          <div class="editor-legenda" id="editorLegenda" hidden>
            <ol id="listaLegenda"></ol>
          </div>

          <div class="acoes-finais">
            <button id="btnExportar" class="primario" type="button">Exportar clipe</button>
            <button id="btnTrocar" class="secundario" type="button" data-i18n="trocar">Trocar vídeo</button>
          </div>

          <div class="progresso" id="progresso" hidden>
            <div class="barra"><div id="barra"></div></div>
            <span id="status"></span>
          </div>
        </div>
      </section>

      <!-- ETAPA 3: resultados -->
      <section id="etapaClipes" class="card" hidden>
        <h2 data-i18n="clipes.titulo">Clipes exportados</h2>
        <ul id="listaClipes" class="clipes"></ul>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
